name: GAPS Repository Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GAPS Repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Compiler/requirements.txt

      - name: Install compiler dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r Compiler/requirements.txt

      - name: Run YAML integrity validation
        id: yaml_validation
        shell: bash
        run: |
          set +e
          python Compiler/validate_yaml.py
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          if [ "$exit_code" -eq 2 ]; then
            echo "::error::YAML integrity validation failed."
            exit 2
          fi

          if [ "$exit_code" -eq 1 ]; then
            echo "::warning::YAML integrity passed with known empty or placeholder files."
          fi

          exit 0

      - name: Run repository validation
        id: repository_validation
        shell: bash
        run: |
          set +e
          python Compiler/validate_repository.py
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          if [ "$exit_code" -eq 2 ]; then
            echo "::error::Repository validation failed."
            exit 2
          fi

          if [ "$exit_code" -eq 1 ]; then
            echo "::warning::Repository validation passed with documented warnings."
          fi

          exit 0

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GAPS Validation Summary"
            echo ""
            echo "| Validator | Exit code | Meaning |"
            echo "|---|---:|---|"
            echo "| YAML integrity | ${{ steps.yaml_validation.outputs.exit_code || 'not run' }} | 0=PASS, 1=WARNING, 2=FAIL |"
            echo "| Repository | ${{ steps.repository_validation.outputs.exit_code || 'not run' }} | 0=PASS, 1=WARNING, 2=FAIL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaps-validation-reports
          path: |
            Management/YAMLIntegrityReport.md
            Management/RepositoryReport.md
          if-no-files-found: warn
          retention-days: 14
