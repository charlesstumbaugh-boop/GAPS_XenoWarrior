###############################################################################
# GameArtBible
# Humanoid.yaml
#
# Canonical Humanoid Construction Contract
#
# Every humanoid character inherits this specification unless explicitly
# overridden by an approved Design Contract.
#
###############################################################################

metadata:

  document:
    id: SPEC_HUMANOID

  version: 1.0.0

  status: APPROVED

###############################################################################

identity:

  class: Humanoid

  inheritance: BaseConstruction

###############################################################################

units:

  reference_height: 100.0

  measurement_unit: percent_height

###############################################################################

proportions:

  head:

    height: 13.0

    width: 12.0

  neck:

    height: 3.0

  shoulders:

    width: 42.0

  chest:

    width: 34.0

  waist:

    width: 24.0

  hips:

    width: 28.0

###############################################################################

vertical_landmarks:

  eye_line: 10.0

  shoulder_line: 18.0

  elbow_line: 44.0

  wrist_line: 63.0

  waist_line: 48.0

  hip_line: 58.0

  knee_line: 79.0

  ankle_line: 94.0

  foot_line: 100.0

###############################################################################

arms:

  upper_arm_length: 26.0

  forearm_length: 22.0

  hand_length: 9.0

###############################################################################

legs:

  thigh_length: 27.0

  shin_length: 25.0

  foot_length: 12.0

###############################################################################

stance:

  default:

    shoulder_width: natural

    feet_spacing: shoulder_width

    weight_distribution: centered

###############################################################################

pose:

  idle:

    spine_rotation: 0

    shoulder_rotation: 0

    head_rotation: 0

###############################################################################

weapon_mounts:

  right_hand:

    required: true

  left_hand:

    support: true

###############################################################################

center_of_mass:

  horizontal: 50

  vertical: 56

###############################################################################

allowed_variation:

  shoulder_width:

    tolerance: 5_percent

  waist:

    tolerance: 5_percent

  arm_length:

    tolerance: 3_percent

###############################################################################

forbidden:

  disproportionate_limbs

  oversized_head

  tiny_hands

  floating_weapon

###############################################################################

validation:

  automatic:

    - landmark_positions

    - limb_lengths

    - center_of_mass

  manual:

    - silhouette

    - readability

###############################################################################

history:

  version: 1.0.0

  notes:

    - Initial humanoid construction contract.
