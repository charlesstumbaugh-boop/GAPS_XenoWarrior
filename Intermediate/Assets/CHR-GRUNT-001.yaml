# CHR-GRUNT-001.yaml
#
# Intermediate Asset Specification (IAS)
# Compiler-compatible schema v1.3.0
###############################################################################

metadata:
  document:
    id: IAS_CHR_GRUNT_001
    name: CHR-GRUNT-001 Intermediate Asset Specification
    type: intermediate_asset_specification
    version: "1.3.0"
    status: DRAFT

  ownership:
    owner: Project Owner
    approval_authority: Project Owner
    maintained_by: GAPS

identity:
  asset_id: CHR-GRUNT-001
  asset_name: Grunt Soldier
  asset_type: character
  asset_subtype: friendly_military_npc
  lifecycle_state: specification
  canonical: true

  narrative_role:
    classification: friendly_secondary_character
    faction: human_military
    alignment: friendly

  gameplay_role:
    role: friendly_npc
    protected_target: true
    valid_player_target: false
    penalty_on_hit: true
    score_modifier: -500
    life_modifier: -1

source_versions:
  repository:
    repository_name: GAPS_XenoWarrior
    repository_version: "0.2.0"

  core_contracts:
    CORE_RENDERING:
      version: repository_current
      file: Core/Rendering.yaml
      status: APPROVED

    CORE_PALETTE:
      version: repository_current
      file: Core/Palette.yaml
      status: APPROVED

    CORE_CAMERA:
      version: repository_current
      file: Core/Camera.yaml
      status: APPROVED

    CORE_LIGHTING:
      version: repository_current
      file: Core/Lighting.yaml
      status: APPROVED

    CORE_EXPORT:
      version: repository_current
      file: Core/Export.yaml
      status: APPROVED

    CORE_VALIDATION:
      version: repository_current
      file: Core/Validation.yaml
      status: APPROVED

    CORE_NAMING:
      version: "1.0.1"
      file: Core/Naming.yaml
      status: APPROVED

    CORE_PROMPT_RULES:
      version: "1.0.0"
      file: Core/PromptRules.yaml
      status: APPROVED

    CORE_GAMEPLAY:
      version: "1.0.0"
      file: Core/Gameplay.yaml
      status: APPROVED

  asset_specifications:
    - id: SPEC_HUMANOID
      version: repository_current
      file: Specifications/Humanoid.yaml

inheritance:
  enabled: true

  parents:
    - id: SPEC_HUMANOID
      version: repository_current
      file: Specifications/Humanoid.yaml
      inheritance_type: full

    - id: CORE_RENDERING
      version: repository_current
      file: Core/Rendering.yaml
      inheritance_type: full

    - id: CORE_PALETTE
      version: repository_current
      file: Core/Palette.yaml
      inheritance_type: full

    - id: CORE_CAMERA
      version: repository_current
      file: Core/Camera.yaml
      inheritance_type: full

    - id: CORE_LIGHTING
      version: repository_current
      file: Core/Lighting.yaml
      inheritance_type: full

    - id: CORE_EXPORT
      version: repository_current
      file: Core/Export.yaml
      inheritance_type: full

visual_contract:
  visual_style:
    category: 2D_arcade_cel_shaded
    genre: military_retro_scifi
    dimensionality: 2D
    photorealistic: false

  silhouette:
    overall_read: friendly_standard_issue_soldier
    distinct_from_player: true
    shoulder_width: narrower_than_player
    torso_profile: less_heroic_than_player
    limb_bulk: lighter_than_player
    primary_readability_features:
      - compact shoulder armor
      - simplified helmet distinct from the player
      - smaller compact assault rifle
      - guarded non-aggressive stance
      - increased visible undersuit
    prohibited_silhouette_changes:
      - copy player shoulder profile
      - copy player helmet profile
      - copy player weapon silhouette
      - use heroic player proportions

  outline:
    uniform: true
    width_px: 4
    color_reference: Shadow Black

  rendering:
    shading_model: two_tone_cel_shading
    shadow_brightness_multiplier: 0.65
    surface_finish: clean_arcade_readability
    anti_aliasing: controlled
    three_dimensional_rendering: false

construction:
  body_plan: adult_humanoid
  animation_ready: true

  proportions:
    heroic_scale: reduced
    shoulders: compact
    torso: standard
    limbs: functional
    feet: fully_visible

  helmet:
    complexity: simplified
    visor_shape: distinct_from_player
    visor_color_reference: Plasma Blue
    exposed_face: false

  armor:
    grade: standard_issue
    torso_layout: distinct_from_player
    shoulder_plates: compact
    decorative_trim: minimal
    wear_level: moderate

  weapon:
    type: compact_assault_rifle
    size_relation: smaller_than_player_rifle
    silhouette: distinct_from_player_weapon
    muzzle_direction: down_and_safe
    obstructs_face: false

  pose:
    stance: guarded_ready
    aggression: low
    balance: centered
    orientation: forward_facing

materials:
  resolved: false

  assignments:
    - component: armor_shell
      material_id: MAT_MILITARY_POLYMER
      status: placeholder_dependency

    - component: under_suit
      material_id: MAT_RUBBER
      status: placeholder_dependency

    - component: visor
      material_id: MAT_VISOR_GLASS
      status: placeholder_dependency

    - component: rifle_body
      material_id: MAT_CARBON_FIBER
      status: placeholder_dependency

  draft_fallback:
    allowed: true
    use_core_rendering_defaults: true
    production_allowed: false

palette:
  source: Core/Palette.yaml
  profile: military_scifi_retro
  raw_color_values_present: false

  assignments:
    - component: armor_primary
      palette_reference: Primary Steel

    - component: armor_secondary
      palette_reference: Gunmetal

    - component: safety_markings
      palette_reference: Hazard Yellow

    - component: visor
      palette_reference: Plasma Blue

    - component: outlines
      palette_reference: Shadow Black

  prohibited:
    - unapproved color additions
    - random color variants
    - player-identical color placement

camera:
  source: Core/Camera.yaml
  orientation: forward_facing
  perspective: rail_shooter_player_facing

  framing:
    full_asset_visible: true
    clipping_allowed: false
    feet_visible: true
    centered_on_canvas: true
    bottom_center_alignment: true

lighting:
  source: Core/Lighting.yaml
  style: two_tone_cel_shaded
  consistency_reference: CHR-PLAYER-001
  shadow_brightness_multiplier: 0.65
  dramatic_backlight: false
  environmental_color_cast: false

animation:
  source_design_master_required: true
  frame_source_policy: derive_from_approved_gold_master
  independent_ai_frame_redesign_allowed: false
  animation_ready_proportions_required: true

  required_states:
    - idle
    - react
    - hit
    - death

  frame_plans:
    idle:
      frames: 6
      loop: true
    react:
      frames: 4
      loop: false
    hit:
      frames: 3
      loop: false
    death:
      frames: 8
      loop: false

export:
  image_format: png
  color_mode: RGBA
  bit_depth: 8
  width_px: 1024
  height_px: 1024
  transparent_background: true
  trim_transparency: false
  full_asset_visible: true
  naming_pattern: "<ASSET_ID>_DESIGN_MASTER_<VERSION>.png"

restrictions:
  redesign_allowed: false
  change_requires_approval: true

  immutable_features:
    - friendly NPC gameplay identity
    - forward-facing orientation
    - distinct silhouette from player
    - compact standard-issue armor
    - simplified distinct helmet
    - smaller compact rifle
    - approved palette and cel-shading style

  prohibited_changes:
    - recolor the player as the Grunt
    - reskin the player as the Grunt
    - mirror the player
    - copy the player helmet
    - copy the player armor layout
    - copy the player rifle
    - add hostile alien features

  prohibited_styles:
    - photorealistic
    - 3D rendered
    - painterly concept art
    - pixel art
    - presentation poster

  prohibited_camera_views:
    - side view
    - rear view
    - three-quarter view
    - top-down view

  prohibited_rendering_features:
    - labels
    - title
    - footer
    - UI panels
    - baked checkerboard
    - scenery
    - floor
    - pedestal
    - cast shadow

  prohibited_export_conditions:
    - opaque background
    - cropped body
    - missing feet
    - trimmed canvas
    - wrong dimensions

validation:
  acceptance_criteria:
    - forward-facing
    - silhouette distinct from player
    - approved palette
    - correct cel shading
    - smaller rifle than player
    - distinct simplified helmet
    - transparent background
    - entire body visible
    - animation-ready proportions
    - friendly NPC readability

  automatic_rejection:
    - player clone
    - player recolor
    - presentation sheet
    - baked checkerboard
    - opaque background
    - cropped body
    - incorrect camera orientation
    - unapproved palette
    - photorealistic or 3D rendering

approval:
  status: DRAFT
  approved_by: null
  approval_date: null
  generation_authorized: false
  production_authorized: false
  locked: false

history:
  current_version: "1.3.0"
  entries:
    - version: "1.0.0"
      change_type: created
      summary: Created CHR-GRUNT-001 as a friendly protected NPC.

    - version: "1.1.0"
      change_type: schema_correction
      summary: Added initial compiler-required mappings.

    - version: "1.2.0"
      change_type: schema_correction
      summary: Added inheritance and visual contract mappings.

    - version: "1.3.0"
      change_type: compiler_alignment
      summary: >
        Aligned field names and nested structures to the active build compiler,
        including asset_name, export, camera framing, palette assignments,
        restrictions, outline, source-version references, and reference images.

reference_images:
  approved_references:
    - reference_id: REF_CHR_PLAYER_001_GOLD_MASTER
      file: Reference/GoldMasters/CHR-PLAYER-001/Design/CHR-PLAYER-001_DESIGN_MASTER_v001.png
      purpose: >
        Style-only authority for rendering language, palette discipline,
        outline treatment, lighting language, and forward-facing presentation.
      authority_level: style_reference

unresolved_requirements:
  items:
    - path: materials.assignments
      issue: Material specification files remain placeholders.
      blocks_generation: false
      blocks_production: true

    - path: gold_master
      issue: CHR-GRUNT-001 Gold Master has not yet been created.
      blocks_generation: false
      blocks_production: true

gold_master:
  asset_id: CHR-GRUNT-001
  image: null
  folder: Reference/GoldMasters/CHR-GRUNT-001/Design/
  version: null
  approval_status: NOT_CREATED
  immutable: true
