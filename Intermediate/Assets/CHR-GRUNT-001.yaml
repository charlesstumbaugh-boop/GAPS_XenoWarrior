visual_contract:
  visual_style:
    category: 2D_arcade_cel_shaded
    genre: military_retro_scifi
    dimensionality: 2D
    photorealistic: false
  silhouette:
    overall_read: friendly_light_combat_infantry
    distinct_from_player: true
    shoulder_width: compact
    torso_profile: slim_segmented
    limb_bulk: light_to_medium
    primary_readability_features:
    - tan/brown tactical undersuit
    - compact rounded metal shoulders
    - hazard-yellow friendly caution accents
    prohibited_silhouette_changes:
    - player power-armor silhouette
    - hostile alien silhouette
  outline:
    uniform: true
    width_px: 4
    color_reference: Shadow Black
  rendering:
    shading_model: two_tone_cel_shading
    shadow_brightness_multiplier: 0.65
    surface_finish: clean_arcade_readability
    three_dimensional_rendering: false
construction:
  body_plan: adult_humanoid
  animation_ready: true
  proportions:
    heroic_scale: reduced
    shoulders: compact
    torso: slim
    limbs: functional
    feet: fully_visible
  helmet:
    complexity: simplified
    visor_shape: wide_horizontal
    visor_color_reference: Plasma Blue
    exposed_face: false
  armor:
    grade: light_combat
    torso_layout: light_segmented
    shoulder_plates: compact_rounded
    decorative_trim: minimal
    wear_level: moderate
    structure: metallic
  weapon:
    type: compact_service_carbine
    size_relation: smaller_than_player_rifle
    silhouette: slim_short_carbine
    muzzle_direction: forward_down_safe
    obstructs_face: false
  pose:
    stance: guarded_ready
    aggression: low
    balance: centered
    orientation: forward_facing
materials:
  resolved: false
  assignments:
  - component: armor_shell
    material_id: MAT_MILITARY_POLYMER
    status: placeholder_dependency
  - component: under_suit
    material_id: MAT_RUBBER
    status: placeholder_dependency
  - component: visor
    material_id: MAT_VISOR_GLASS
    status: placeholder_dependency
  - component: weapon_body
    material_id: MAT_CARBON_FIBER
    status: placeholder_dependency
  draft_fallback:
    allowed: true
    use_core_rendering_defaults: true
    production_allowed: false
palette:
  source: Core/Palette.yaml
  profile: military_scifi_retro
  raw_color_values_present: false
  assignments:
  - component: armor_primary
    palette_reference: Primary Steel
  - component: armor_secondary
    palette_reference: Gunmetal
  - component: friendly_undersuit
    palette_reference: Tan/Brown
  - component: caution_markings
    palette_reference: Hazard Yellow
  - component: visor
    palette_reference: Plasma Blue
  - component: outlines
    palette_reference: Shadow Black
  prohibited:
  - unapproved color additions
  - player-identical color placement
camera:
  source: Core/Camera.yaml
  orientation: forward_facing
  perspective: rail_shooter_player_facing
  framing:
    full_asset_visible: true
    clipping_allowed: false
    feet_visible: true
    centered_on_canvas: true
    bottom_center_alignment: true
lighting:
  source: Core/Lighting.yaml
  style: two_tone_cel_shaded
  consistency_reference: CHR-PLAYER-001
  shadow_brightness_multiplier: 0.65
  dramatic_backlight: false
  environmental_color_cast: false
animation:
  source_design_master_required: true
  frame_source_policy: derive_from_approved_gold_master
  independent_ai_frame_redesign_allowed: false
  animation_ready_proportions_required: true
  required_states:
  - idle
  - react
  - hit
  - death
  frame_plans:
    idle:
      frames: 6
      loop: true
    react:
      frames: 4
      loop: false
    hit:
      frames: 3
      loop: false
    death:
      frames: 8
      loop: false
export:
  image_format: png
  color_mode: RGBA
  bit_depth: 8
  width_px: 1024
  height_px: 1024
  transparent_background: true
  trim_transparency: false
  full_asset_visible: true
  naming_pattern: <ASSET_ID>_DESIGN_MASTER_<VERSION>.png
restrictions:
  redesign_allowed: false
  change_requires_approval: true
  immutable_features:
  - rounded low-profile helmet with wide blue visor
  - light metallic armor over tan/brown tactical undersuit
  - compact carbine
  - hazard-yellow friendly caution accents
  prohibited_changes:
  - player clone
  - player recolor
  - player power-armor silhouette
  - heavy player rifle
  - hostile alien morphology
  prohibited_styles:
  - photorealistic
  - 3D rendered
  - painterly concept art
  - pixel art
  - presentation poster
  prohibited_camera_views:
  - side view
  - rear view
  - three-quarter view
  - top-down view
  prohibited_rendering_features:
  - labels
  - title
  - footer
  - UI panels
  - baked checkerboard
  - scenery
  - floor
  - pedestal
  - cast shadow
  prohibited_export_conditions:
  - opaque background
  - cropped body
  - missing feet
  - trimmed canvas
  - wrong dimensions
validation:
  acceptance_criteria:
  - forward-facing
  - friendly NPC identity
  - approved palette
  - correct cel shading
  - compact carbine
  - rounded helmet with wide blue visor
  - transparent background
  - entire body visible
  - animation-ready proportions
  - distinct from player
  automatic_rejection:
  - player clone
  - player recolor
  - presentation sheet
  - baked checkerboard
  - opaque background
  - cropped body
  - incorrect camera orientation
  - unapproved palette
  - photorealistic or 3D rendering
