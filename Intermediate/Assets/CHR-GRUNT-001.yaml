      approved_by: Project Owner

    - version: "1.1.0"
      change_type: schema_correction
      summary: >
        Added compiler-required identity, source_versions, construction,
        materials, palette, camera, lighting, animation, and restrictions
        mappings.
      approved_by: Project Owner

    - version: "1.2.0"
