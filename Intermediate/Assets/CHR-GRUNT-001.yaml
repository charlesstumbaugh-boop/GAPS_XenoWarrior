#
# Intermediate Asset Specification (IAS)
# Friendly secondary character / protected NPC
# Compiler-compatible schema revision
###############################################################################

metadata:
  document:
    id: IAS_CHR_GRUNT_001
    name: CHR-GRUNT-001 Intermediate Asset Specification
    type: intermediate_asset_specification
    version: "1.2.0"
    status: DRAFT

  project:
    id: GAPS_XENOWARRIOR
    repository: GAPS_XenoWarrior

  ownership:
    owner: Project Owner
    approval_authority: Project Owner
    maintained_by: GAPS

identity:
  asset_id: CHR-GRUNT-001
  display_name: Grunt Soldier
  category: character
  subcategory: friendly_npc
  faction: human_military
  gameplay_role: friendly_npc
  allegiance: friendly
  is_enemy: false
  is_boss: false
  is_player_character: false
  is_secondary_character: true
  protected_npc: true

  description: >
    A secondary human military character who appears in the play space as a
    protected friendly NPC. The character may be accidentally hit by the player,
    causing score and life penalties. This asset is not an enemy.

inheritance:
  core:
    rendering: Core/Rendering.yaml
    palette: Core/Palette.yaml
    camera: Core/Camera.yaml
    lighting: Core/Lighting.yaml
    export: Core/Export.yaml
    validation: Core/Validation.yaml
    naming: Core/Naming.yaml
    prompt_rules: Core/PromptRules.yaml
    gameplay: Core/Gameplay.yaml

  specifications:
    humanoid: Specifications/Humanoid.yaml

  materials:
    military_polymer: Specifications/Materials/MilitaryPolymer.yaml
    rubber: Specifications/Materials/Rubber.yaml
    visor_glass: Specifications/Materials/VisorGlass.yaml
    carbon_fiber: Specifications/Materials/CarbonFiber.yaml

  references:
    player_gold_master:
      reference_id: REF_CHR_PLAYER_001_GOLD_MASTER
      path: Reference/GoldMasters/CHR-PLAYER-001/Design/CHR-PLAYER-001_DESIGN_MASTER_v001.png
      role: style_only

source_versions:
  core:
    rendering:
      path: Core/Rendering.yaml
      version: repository_current
    palette:
      path: Core/Palette.yaml
      version: repository_current
    camera:
      path: Core/Camera.yaml
      version: repository_current
    lighting:
      path: Core/Lighting.yaml
      version: repository_current
    export:
      path: Core/Export.yaml
      version: repository_current
    validation:
      path: Core/Validation.yaml
      version: repository_current
    naming:
      path: Core/Naming.yaml
      version: "1.0.1"
    prompt_rules:
      path: Core/PromptRules.yaml
      version: "1.0.0"
    gameplay:
      path: Core/Gameplay.yaml
      version: "1.0.0"

  specifications:
    humanoid:
      path: Specifications/Humanoid.yaml
      version: repository_current

  reference_images:
    player_gold_master:
      reference_id: REF_CHR_PLAYER_001_GOLD_MASTER
      path: Reference/GoldMasters/CHR-PLAYER-001/Design/CHR-PLAYER-001_DESIGN_MASTER_v001.png
      role: style_only
      approved: true
      version: v001

visual_contract:
  output_type: production_asset
  asset_count: 1

  canvas:
    width: 1024
    height: 1024
    units: pixels
    color_mode: RGBA
    transparent_background: true
    trim_transparency: false

  composition:
    full_body_required: true
    entire_body_visible: true
    feet_visible: true
    clipping_allowed: false
    centered_on_canvas: true
    bottom_center_alignment: true

  orientation:
    forward_facing: true
    rail_shooter_player_facing: true
    head_toward_player: true
    torso_toward_player: true

  rendering:
    style: 2D_arcade_cel_shaded
    shading: two_tone
    shadow_brightness_multiplier: 0.65
    outline_width_pixels: 4
    outline_color: Shadow Black
    photorealistic: false
    three_dimensional_rendering: false

  identity:
    distinct_from_player: true
    friendly_npc_readability: true
    player_clone_allowed: false
    player_recolor_allowed: false
    player_reskin_allowed: false
    equipment_swap_clone_allowed: false

  prohibited_output:
    - poster
    - infographic
    - character_sheet
    - labels
    - title
    - footer
    - logo
    - user_interface
    - rendered_checkerboard
    - opaque_background
    - scenery
    - floor
    - pedestal
    - cast_shadow
    - cropped_body
    - missing_feet

construction:
  body_plan: adult_humanoid
  skeleton_profile: humanoid
  body_type: standard_military
  heroic_scale: reduced
  animation_ready: true

  proportions:
    head_to_body_ratio: standard_animation_ready
    shoulder_width: narrower_than_player
    torso_profile: compact_standard
    limb_bulk: lighter_than_player
    leg_length: standard
    hand_scale: functional
    boot_scale: standard
    symmetry: mostly_symmetric

  silhouette:
    overall_read: friendly_standard_issue_soldier
    distinct_from_player: true
    less_heroic_than_player: true
    compact_shoulders: true
    readable_at_gameplay_distance: true

  helmet:
    complexity: simplified
    visor_shape: distinct_from_player
    visor_color: Plasma Blue
    exposed_face: false
    antennae: false
    exact_player_helmet_copy_allowed: false

  armor:
    grade: standard_issue
    torso_layout: distinct_from_player
    shoulder_plates: compact
    under_suit_exposure: increased
    decorative_trim: minimal
    wear_level: moderate
    exact_player_armor_copy_allowed: false

  weapon:
    type: compact_assault_rifle
    size_relation: smaller_than_player_rifle
    silhouette: distinct_from_player_weapon
    carried_ready: true
    muzzle_direction: down_and_safe
    finger_off_trigger: true
    obstructs_face: false
    exact_player_weapon_copy_allowed: false

  pose:
    pose_id: FRIENDLY_GRUNT_READY_FRONT
    stance: guarded_ready
    balance: centered
    aggression: low
    feet: shoulder_width
    knees: slightly_bent
    head_direction: toward_player
    torso_direction: toward_player
    weapon_across_torso: true

materials:
  resolved: false

  assignments:
    armor_shell:
      material_id: MAT_MILITARY_POLYMER
      source: Specifications/Materials/MilitaryPolymer.yaml
      status: placeholder_dependency

    under_suit:
      material_id: MAT_RUBBER
      source: Specifications/Materials/Rubber.yaml
      status: placeholder_dependency

    visor:
      material_id: MAT_VISOR_GLASS
      source: Specifications/Materials/VisorGlass.yaml
      status: placeholder_dependency

    rifle_body:
      material_id: MAT_CARBON_FIBER
      source: Specifications/Materials/CarbonFiber.yaml
      status: placeholder_dependency

  fallback_policy:
    allowed_for_draft_compile: true
    use_core_rendering_defaults: true
    production_allowed: false

palette:
  source: Core/Palette.yaml
  resolved: true
  profile: military_scifi_retro

  allowed_colors:
    - Primary Steel
    - Gunmetal
    - Hazard Yellow
    - Bio-Green
    - Plasma Blue
    - Warning Red
    - Shadow Black

  dominant:
    - Primary Steel
    - Gunmetal

  accents:
    - Hazard Yellow
    - Plasma Blue

  prohibited:
    - unapproved_neon_colors
    - random_color_variants
    - photorealistic_material_colors

camera:
  source: Core/Camera.yaml
  resolved: true
  orientation: forward_facing
  perspective: rail_shooter_player_facing
  head_direction: toward_player
  torso_direction: toward_player
  full_body_required: true
  entire_body_visible: true
  clipping_allowed: false

lighting:
  source: Core/Lighting.yaml
  resolved: true
  consistency_reference: CHR-PLAYER-001
  dramatic_backlight: false
  environmental_color_cast: false
  style: two_tone_cel_shaded
  shadow_brightness_multiplier: 0.65

animation:
  source_design_master_required: true
  frame_source_policy: derive_from_approved_gold_master
  ai_independent_frame_redesign_allowed: false
  animation_ready_proportions_required: true

  states:
    idle:
      required: true
      frames: 6
      loop: true

    react:
      required: true
      frames: 4
      loop: false

    hit:
      required: true
      frames: 3
      loop: false

    death:
      required: true
      frames: 8
      loop: false

  optional_states:
    - wave
    - duck
    - flee
    - signal

restrictions:
  no_presentation_sheet: true
  no_infographic: true
  no_character_sheet: true
  no_title: true
  no_labels: true
  no_footer: true
  no_logo: true
  no_ui_panels: true
  no_rendered_checkerboard: true
  no_opaque_background: true
  no_scenery: true
  no_floor: true
  no_pedestal: true
  no_cast_shadow: true
  no_cropping: true
  no_missing_feet: true
  no_player_clone: true
  no_player_recolor: true
  no_player_reskin: true
  no_player_mirror: true
  no_equipment_swap_clone: true
  no_hostile_alien_features: true
  no_photorealistic_rendering: true
  no_three_dimensional_rendering: true
  no_wrong_camera_orientation: true
  no_unapproved_palette: true

reference_policy:
  identity_references: []

  style_only_references:
    - reference_id: REF_CHR_PLAYER_001_GOLD_MASTER
      path: Reference/GoldMasters/CHR-PLAYER-001/Design/CHR-PLAYER-001_DESIGN_MASTER_v001.png
      role: style_only
      approved: true

  rules:
    copy_style_not_design: true
    preserve_distinct_asset_identity: true

    player_reference_may_define:
      - rendering_style
      - palette_discipline
      - outline_treatment
      - lighting_language
      - material_finish
      - camera_orientation

    player_reference_may_not_define:
      - helmet_geometry
      - armor_layout
      - silhouette
      - weapon_identity
      - body_proportions
      - accessory_layout
      - exact_color_placement

gameplay:
  asset_id: CHR-GRUNT-001
  asset_class: character
  gameplay_role: friendly_npc
  allegiance: friendly

  targeting:
    targetable: true
    lock_on_allowed: false
    aim_assist_allowed: false
    valid_player_target: false
    protected_target: true
    accidental_hit_allowed: true

  damage:
    can_receive_damage: true
    can_damage_player: false
    friendly_fire_enabled: true
    hit_points: 1
    damage_immunity:
      - none
    death_on_zero_health: true

  scoring:
    points_on_hit: 0
    points_on_destroy: 0
    points_on_rescue: 0
    points_on_miss: 0
    combo_effect: reset

  penalties:
    penalty_on_hit: true
    score_modifier: -500
    life_modifier: -1
    health_modifier: 0
    mission_failure_on_destroy: false
    combo_reset_on_hit: true

  behavior:
    movement_profile: scripted_path
    aggression: none
    awareness: scripted
    despawn_policy: offscreen

export:
  file_format: PNG
  color_mode: RGBA
  bit_depth: 8
  transparent_background: true
  trim_transparency: false
  canvas_locked: true
  width: 1024
  height: 1024
  naming_pattern: "<ASSET_ID>_DESIGN_MASTER_<VERSION>.png"

unity:
  texture_type: Sprite
  sprite_mode: Single
  pixels_per_unit: 100
  mesh_type: Full Rect
  pivot: Bottom Center
  filter_mode: Point
  compression: None
  mip_maps: false
  gameplay_tag: FriendlyNPC
  gameplay_layer: Friendly

validation:
  acceptance_criteria:
    forward_facing: required
    correct_silhouette: required
    correct_palette: required
    correct_cel_shading: required
    correct_rifle_size: required
    correct_helmet: required
    transparent_background: required
    entire_body_visible: required
    animation_ready_proportions: required
    visually_distinct_from_player: required
    friendly_role_readability: required

  automatic_rejection:
    - presentation_sheet
    - infographic
    - labels
    - footer
    - baked_checkerboard
    - opaque_background
    - cropped_body
    - missing_feet
    - player_clone
    - player_recolor
    - incorrect_weapon_scale
    - photorealistic_rendering
    - three_dimensional_rendering
    - wrong_camera_orientation
    - hostile_alien_features
    - unapproved_palette

unresolved_requirements:
  blocking_generation:
    - material_profiles_are_placeholders

  blocking_production:
    - final_gold_master_not_yet_created
    - visual_review_not_yet_completed
    - unity_import_not_yet_validated
    - animation_source_not_yet_created

approval:
  status: DRAFT
  approved_by: null
  approval_date: null
  approval_reference: null
  generation_authorized: false
  production_authorized: false
  locked: false

  current_gate_results:
    schema_complete: true
    inheritance_resolved: true
    materials_resolved: false
    palette_resolved: true
    construction_resolved: true
    gameplay_resolved: true
    weapon_resolved: true
    reference_master_available: true
    animation_frame_plans_available: true
    generation_ready: false
    production_ready: false

gold_master:
  asset_id: CHR-GRUNT-001
  image: null
  folder: Reference/GoldMasters/CHR-GRUNT-001/Design/
  version: null
  approval_status: NOT_CREATED
  approval_date: null
  immutable: true

