###############################################################################
# COMPONENT DESIGN
###############################################################################

component_design:
  helmet:
    required: true
    enclosure: fully_enclosed
    overall_shape: rounded_military_shell
    symmetry: symmetrical

    silhouette_features:
      - rounded_upper_shell
      - reinforced_side_sections
      - recessed_horizontal_visor
      - short_integrated_neck_guard

    visor:
      shape: horizontal_band
      width_relationship: wide
      height_relationship: narrow
      color_reference: PALETTE_PLASMA_BLUE
      emissive: true
      glow_strength: low
      eye_details_visible: false

    prohibited_features:
      - exposed_face
      - visible_human_eyes
      - open_mouth
      - large antenna
      - decorative horns
      - fantasy crest
      - transparent full-face dome

    unresolved_details:
      - exact rear helmet geometry
      - exact visor width percentage
      - exact side-panel arrangement
      - exact lower-face plate construction

  torso_armor:
    required: true
    overall_shape: compact_armored_block
    chest_profile: broad
    waist_profile: narrow
    symmetry: mostly_symmetrical

    chest_panel_language:
      center_panels:
        estimated_count: 3
        confidence: medium
      panel_orientation: vertical_and_diagonal
      panel_depth: shallow
      visible_fasteners: minimal

    abdomen:
      construction: segmented_protective_plates
      flexibility_read: moderate
      exposed_cloth_allowed: false

    back_design_status: unresolved

  shoulder_armor:
    required: true
    size: large
    shape: rounded_mechanical
    profile: broad
    symmetry: symmetrical
    separate_from_upper_arm: visually_separated

    prohibited:
      - pointed_fantasy_pauldrons
      - tiny_shoulder_caps
      - exposed_bare_shoulders
      - asymmetrical_default_design

  arm_armor:
    upper_arms:
      construction: segmented_armor
      bulk: medium

    elbows:
      construction: reinforced_joint
      exposed_joint_gap: minimal

    forearms:
      construction: reinforced_gauntlet
      bulk: medium_large
      silhouette_priority: high

    hands:
      construction: armored_gloves
      finger_detail: simplified
      weapon_contact_required: true

  hip_armor:
    construction: compact_segmented_belt
    bulk: low_medium
    hanging_fabric: forbidden
    pouches:
      allowed: true
      quantity: minimal

  leg_armor:
    thighs:
      construction: armored_front_plates
      bulk: medium

    knees:
      construction: reinforced_knee_pads
      visibility: required

    shins:
      construction: armored_greaves
      bulk: medium

    boots:
      construction: reinforced_military_boots
      sole_profile: stable
      heel_exaggeration: none

  under_suit:
    visibility: limited_to_joint_gaps
    finish: matte
    pattern: none
    color_reference: PALETTE_GUNMETAL

###############################################################################
# MATERIALS
###############################################################################

materials:
  assignments:
    - component: helmet_shell
      material_id: MAT_PAINTED_STEEL
      material_version: "1.0.0"
      material_file: GameArtBible/Specifications/Materials/PaintedSteel.yaml
      surface_area_priority: primary
      override_allowed: false

    - component: chest_armor
      material_id: MAT_PAINTED_STEEL
      material_version: "1.0.0"
      material_file: GameArtBible/Specifications/Materials/PaintedSteel.yaml
      surface_area_priority: primary
      override_allowed: false

    - component: shoulder_armor
      material_id: MAT_PAINTED_STEEL
      material_version: "1.0.0"
      material_file: GameArtBible/Specifications/Materials/PaintedSteel.yaml
      surface_area_priority: primary
      override_allowed: false

    - component: arm_armor
      material_id: MAT_PAINTED_STEEL
      material_version: "1.0.0"
      material_file: GameArtBible/Specifications/Materials/PaintedSteel.yaml
      surface_area_priority: secondary
      override_allowed: false

    - component: leg_armor
      material_id: MAT_PAINTED_STEEL
      material_version: "1.0.0"
      material_file: GameArtBible/Specifications/Materials/PaintedSteel.yaml
      surface_area_priority: primary
      override_allowed: false

  provisional_assignments:
    - component: visor
      proposed_material_id: MAT_VISOR_GLASS
      status: REQUIRES_REVIEW
      reason: >
        The poster clearly depicts luminous reinforced visor material, but the
        VisorGlass material specification has not yet been created.

    - component: under_suit
      proposed_material_id: MAT_MILITARY_POLYMER
      status: REQUIRES_REVIEW
      reason: >
        The joint material appears matte and flexible, but the reusable polymer
        material specification has not yet been created.

    - component: gloves_and_boot_flex_sections
      proposed_material_id: MAT_RUBBER
      status: REQUIRES_REVIEW
      reason: >
        Flexible dark joint surfaces require a reusable rubber specification.

    - component: rifle_body
      proposed_material_id: MAT_PAINTED_STEEL
      status: REQUIRES_REVIEW
      reason: >
        The rifle appears to use the same military hard-surface language, but a
        dedicated weapon specification is still required.

  prohibited_materials:
    - chrome
    - mirror_finish
    - polished_gold
    - bare_human_skin
    - fabric_cape
    - leather
    - wood
    - organic_alien_tissue

  unresolved_materials:
    - MAT_VISOR_GLASS
    - MAT_MILITARY_POLYMER
    - MAT_RUBBER
    - canonical weapon material assignment

###############################################################################
# PALETTE
###############################################################################

palette:
  palette_contract: CORE_PALETTE

  assignments:
    - component: primary_armor
      palette_id: PALETTE_PRIMARY_STEEL
      usage_role: primary
      percentage_target: 48
      percentage_tolerance: 10

    - component: secondary_armor_and_under_suit
      palette_id: PALETTE_GUNMETAL
      usage_role: secondary
      percentage_target: 30
      percentage_tolerance: 8

    - component: visor
      palette_id: PALETTE_PLASMA_BLUE
      usage_role: emissive
      percentage_target: 4
      percentage_tolerance: 2

    - component: warning_and_weapon_accents
      palette_id: PALETTE_HAZARD_YELLOW
      usage_role: accent
      percentage_target: 5
      percentage_tolerance: 3

    - component: outlines_and_deep_separation
      palette_id: PALETTE_SHADOW_BLACK
      usage_role: outline
      percentage_target: 13
      percentage_tolerance: 5

  shadow_multiplier: 0.65
  raw_color_values_present: false

  prohibited_palette_ids:
    - PALETTE_BIO_GREEN

  conditional_palette_ids:
    PALETTE_WARNING_RED:
      allowed_for:
        - hit_effect
        - damage_feedback
      forbidden_for:
        - default_armor
        - default_visor
        - friendly_identification

  color_distribution_rules:
    primary_steel_must_dominate_armor: true
    plasma_blue_limited_to_energy_and_visor: true
    hazard_yellow_used_as_small_accent_only: true
    warning_red_not_present_in_default_idle_design: true
    bio_green_not_present_in_player_design: true

###############################################################################
# CAMERA
###############################################################################

camera:
  camera_contract: CORE_CAMERA
  projection: perspective
  orientation: forward_facing
  pitch_degrees: 0
  yaw_degrees: 0
  roll_degrees: 0
  field_of_view_degrees: 60
  horizon_position: center

  vanishing_point:
    horizontal: center
    vertical: center

  framing:
    full_asset_visible: true
    clipping_allowed: false
    head_margin_percent: 8
    foot_margin_percent: 2
    side_margin_percent: 5

  pivot:
    x: 0.5
    y: 0.0
    units: normalized

  pose_presentation:
    head_orientation: forward
    torso_orientation: forward
    pelvis_orientation: forward
    weapon_orientation: player_readable
    three_quarter_rotation_allowed: false
    profile_rotation_allowed: false

###############################################################################
# LIGHTING
###############################################################################

lighting:
  lighting_contract: CORE_LIGHTING

  primary_light:
    horizontal_direction: left
    vertical_direction: above
    angle_degrees: 45
    intensity: 1.0

  fill_light_enabled: false
  ambient_light_enabled: false

  rim_light:
    enabled: false
    exception_reference: null

  shadow:
    multiplier: 0.65
    edge: hard
    blur_allowed: false

  emissive_components:
    - component: visor
      palette_id: PALETTE_PLASMA_BLUE
      glow_strength: low
      glow_bleed_allowed: false

  lighting_continuity:
    fixed_between_frames: true
    light_direction_may_change: false
    shadow_direction_may_change: false
    visor_glow_may_flicker: false

###############################################################################
# EQUIPMENT AND WEAPON
###############################################################################

equipment:
  equipped_assets:
    - asset_id: WEAPON_PLAYER_RIFLE_001
