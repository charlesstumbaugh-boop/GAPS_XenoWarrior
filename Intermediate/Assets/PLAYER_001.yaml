###############################################################################
# GAPS_XenoWarrior
# PLAYER_001.yaml
#
# Xeno Warrior Player
# Intermediate Asset Specification
#
# Reverse-engineered from the approved VR Rail-Shooter Unified Art Bible
# poster and inherited GameArtBible contracts.
#
# This document defines the canonical player design at the level currently
# supported by the available reference artwork.
###############################################################################

metadata:
  document:
    id: IAS_PLAYER_001
    name: Xeno Warrior Player Intermediate Asset Specification
    type: intermediate_asset_specification
    version: "0.1.0"
    status: DRAFT

  dates:
    created: "2026-08-05"
    last_modified: "2026-08-05"
    approved: null

  ownership:
    owner: Project Owner
    maintained_by: GameArtBible
    approval_authority: Project Owner

  provenance:
    creation_method: reverse_engineered_from_reference_art
    confidence_level: medium
    original_prompt_data_available: false
    internal_generation_parameters_available: false
    visual_measurements_are_estimates: true

###############################################################################
# IDENTITY
###############################################################################

identity:
  asset_id: PLAYER_001
  asset_name: Xeno Warrior Player
  asset_type: character
  asset_subtype: humanoid_player
  lifecycle_state: specification
  canonical: true
  replaces_asset_id: null

  narrative_role:
    classification: player_character
    faction: human_military
    alignment: friendly
    setting: military_retro_scifi

  production_role:
    primary_use: player_facing_sprite
    secondary_use:
      - loading_screen_art
      - character_selection_art
      - tutorial_diagrams
      - promotional_art
    gameplay_camera_relationship: faces_camera

###############################################################################
# SOURCE VERSIONS
###############################################################################

source_versions:
  repository:
    repository_name: GAPS_XenoWarrior
    repository_version: "0.1.0"
    game_art_bible_version: "0.1.0"

  core_contracts:
    CORE_RENDERING:
      version: "1.0.0"
      file: GameArtBible/Core/Rendering.yaml
      status: APPROVED

    CORE_PALETTE:
      version: "1.0.0"
      file: GameArtBible/Core/Palette.yaml
      status: APPROVED

    CORE_CAMERA:
      version: "1.0.0"
      file: GameArtBible/Core/Camera.yaml
      status: APPROVED

    CORE_LIGHTING:
      version: "1.0.0"
      file: GameArtBible/Core/Lighting.yaml
      status: APPROVED

    CORE_ANIMATION:
      version: "1.0.0"
      file: GameArtBible/Core/Animation.yaml
      status: APPROVED

    CORE_EXPORT:
      version: "1.0.0"
      file: GameArtBible/Core/Export.yaml
      status: APPROVED

    CORE_VALIDATION:
      version: "1.0.0"
      file: GameArtBible/Core/Validation.yaml
      status: APPROVED

  asset_specifications:
    - id: SPEC_HUMANOID
      version: "1.0.0"
      file: GameArtBible/Specifications/Construction/Humanoid.yaml

    - id: MAT_PAINTED_STEEL
      version: "1.0.0"
      file: GameArtBible/Specifications/Materials/PaintedSteel.yaml

  reference_sources:
    - reference_id: REF_PLAYER_POSTER_001
      type: concept
      status: available
      authority_level: design
      purpose: >
        Establish the approved military retro science-fiction appearance,
        broad silhouette, helmet language, visor color, armor character,
        weapon readability, and front-facing presentation.
      limitations:
        - player artwork is small relative to the poster
        - no clean isolated transparent player asset exists
        - no rear view exists
        - no side view exists
        - exact panel geometry cannot be measured reliably
        - exact weapon dimensions cannot be measured reliably
        - individual animation frames are not available at production size

