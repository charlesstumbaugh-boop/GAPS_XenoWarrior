      approval_reference: PENDING_PLAYER_DESIGN_REVIEW

    - path: construction.proportions.waist.width
      inherited_value: 24.0
      override_value: 23.0
      reason: >
        The reference presents a compact torso with a visibly narrower waist
        relative to the armored shoulders.
