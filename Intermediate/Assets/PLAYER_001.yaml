###############################################################################
# CLASSIFICATION
###############################################################################

classification:
  asset_class: HUMANOID
  gameplay_role: armed_player_character
  faction: human_military
  threat_level: none
  size_class: medium
  mobility_class: humanoid_ground

  visual_archetype:
    primary: armored_space_soldier
    secondary: retro_arcade_commando

  gameplay_readability:
    intended_recognition: immediate
    weapon_identification: required
    visor_identification: required
    silhouette_priority: maximum

###############################################################################
# GAMEPLAY FUNCTION
###############################################################################

gameplay_function:
  purpose: >
    Serve as the canonical armored player character and establish the baseline
    humanoid military visual language for the project.

  player_read: >
    Broad, compact, heavily armored human combatant with a bright Plasma Blue
    visor and a clearly readable two-handed futuristic rifle.

  friendly_identification_features:
    - Plasma Blue visor
    - Primary Steel armor
    - Gunmetal structural components
    - compact military rifle
    - symmetrical armored silhouette
    - absence of Bio-Green biological weak points
    - absence of Warning Red hostile identification markings

  gameplay_feedback:
    - muzzle flash during firing
    - visible recoil during firing
    - readable magazine handling during reload
    - immediate backward or lateral response during hit
    - backward fall during death
    - Warning Red hit burst when damaged

###############################################################################
# VISUAL CONTRACT
###############################################################################

visual_contract:
  visual_style:
    rendering_profile: CORE_RENDERING
    style_name: Military Retro Sci-Fi
    realism_level: low
    arcade_readability: maximum

  silhouette:
    description: >
      Broad-shouldered armored humanoid with a compact torso, reinforced limbs,
      enclosed helmet, luminous horizontal visor, and a prominent two-handed
      rifle held across the front of the body.

    primary_readability_features:
      - broad armored shoulder line
      - enclosed rounded military helmet
      - horizontal Plasma Blue visor
      - narrow waist relative to shoulder armor
      - compact armored torso
      - rifle visible across the central body mass
      - reinforced forearms
      - armored knees and lower legs
      - stable two-foot stance

    prohibited_silhouette_changes:
      - narrow shoulders
      - oversized head
      - exposed human face
      - long thin limbs
      - unarmored torso
      - hidden weapon
      - one-handed pistol stance
      - extreme bodybuilder proportions
      - anime body proportions
      - crouched default posture
      - three-quarter default presentation

    recognition_distance: null
    recognition_distance_units: null

  shape_language:
    primary_shapes:
      - rounded_rectangles
      - compact_armor_blocks
      - beveled_mechanical_panels
      - horizontal_visor_band

    secondary_shapes:
      - short_cylinders
      - reinforced_joint_discs
      - angular_weapon_panels
      - compact_trapezoids

    corner_language: mixed
    symmetry: mostly_symmetrical

  outline:
    inherited_from: CORE_RENDERING
    width_px: 4
    color_reference: PALETTE_SHADOW_BLACK
    uniform: true

  rendering:
    shading_method: two_tone_cel
    shading_levels: 2
    shadow_brightness_multiplier: 0.65
    gradients_allowed: false
    soft_airbrush_allowed: false
    painterly_texture_allowed: false
    photorealism_allowed: false
    hard_edge_definition_required: true

  visual_density:
    detail_level: medium
    micro_detail_priority: low
    large_shape_priority: high
    armor_panel_count_target: moderate
    surface_noise: minimal

