###############################################################################
# GENERATION GUIDANCE
###############################################################################

generation_guidance:
  provider_neutral_description: >
    A forward-facing armored human player character for a retro military
    science-fiction VR rail shooter. The character has broad rounded shoulder
    armor, a compact segmented torso, reinforced limbs, a fully enclosed rounded
    military helmet, a narrow horizontal Plasma Blue luminous visor, and a
    compact two-handed futuristic assault rifle held visibly across the lower
    chest. Artwork uses only the approved Military Retro Sci-Fi palette,
    two-tone cel shading, hard shadow edges, and uniform four-pixel Shadow Black
    outlines. The complete body and weapon remain visible on a transparent
    background with a fixed bottom-center pivot.

  positive_requirements:
    - forward-facing full-body armored humanoid
    - broad shoulder silhouette
    - compact torso
    - rounded enclosed military helmet
    - narrow horizontal Plasma Blue visor
    - Primary Steel armor
    - Gunmetal secondary armor and under-suit
    - small Hazard Yellow accents
    - two-tone cel shading
    - hard shadow boundaries
    - uniform four-pixel Shadow Black outlines
    - compact two-handed futuristic rifle
    - both hands visibly contact the weapon
    - transparent background
    - full body visible
    - consistent scale and pivot
    - upper-left directional lighting
    - low visor glow without glow bleed

  negative_requirements:
    - no redesign
    - no photorealism
    - no painterly texture
    - no gradients
    - no soft shading
    - no three-quarter view
    - no profile view
    - no rear view
    - no top-down view
    - no isometric view
    - no cropped limbs
    - no cropped weapon
    - no opaque background
    - no weapon substitution
    - no helmet substitution
    - no exposed face
    - no Bio-Green player armor
    - no Warning Red default armor
    - no anime proportions
    - no exaggerated head size
    - no random armor panels
    - no random accessories
    - no antenna
    - no cape
    - no cloth coat
    - no motion blur
    - no depth of field
    - no lens flare
    - no excessive bloom

  provider_specific_overrides_allowed: false

###############################################################################
# RESTRICTIONS
###############################################################################

restrictions:
  immutable_features:
    - humanoid body class
    - broad shoulder silhouette
    - compact torso proportions
    - fully enclosed helmet
    - horizontal Plasma Blue visor
    - Primary Steel dominant armor
    - Gunmetal secondary surfaces
    - two-handed rifle
    - forward-facing orientation
    - two-tone cel shading
    - four-pixel uniform outline
    - bottom-center pivot
    - upper-left lighting direction

  prohibited_changes:
    - redesign
    - helmet shape replacement
    - visor shape replacement
    - visor color replacement
    - shoulder width reduction
    - torso elongation
    - body proportion drift
    - weapon substitution
    - rifle scale drift
    - armor panel randomization
    - palette substitution
    - material substitution
    - perspective change
    - camera change
    - lighting direction change
    - outline width change
    - frame-to-frame detail mutation
    - frame-to-frame handedness reversal

  prohibited_styles:
    - photorealistic
    - painterly
    - watercolor
    - oil_painting
    - sketch
    - pencil
    - anime
    - manga
    - comic_book
    - airbrush
    - three_dimensional_photoreal_render

  prohibited_camera_views:
    - profile
    - rear
    - top_down
    - isometric
    - extreme_low_angle
    - extreme_high_angle
    - three_quarter

  prohibited_rendering_features:
    - soft_gradients
    - blurred_shadows
    - motion_blur
    - depth_of_field
    - lens_flare
    - global_bloom
    - realistic_reflections
    - chrome_finish
    - ray_traced_appearance

  prohibited_export_conditions:
    - cropped_sprite
    - cropped_weapon
    - cropped_effect
    - opaque_background
    - lossy_format
    - inconsistent_canvas_size
    - inconsistent_pivot
    - inconsistent_frame_scale
    - automatic_transparency_trimming

  redesign_allowed: false
  change_requires_approval: true

